name: Python CI

on: 
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      -name: Checkout repository
      uses: actions/setup-python@v4

      -name: Set up Python
      uses: actions/setup-pythonon@v5
      with: 
        python-version: "3.12"   

    -name: Install dependencies
     run: |
       cd python-ci
       pip install -r requirements.txt

    -name: Run tests
     run: |
     cd python-ci
     pytest
